<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Siplor — ระบบจองโต๊ะ</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
  <style>
    .flatpickr-day.tuesday { color: #c0392b !important; font-weight: 700 !important; }
    .flatpickr-day.tuesday:hover { background: #fff0ef !important; border-color: #c0392b !important; }
    .flatpickr-day.tuesday.selected { background: #c0392b !important; border-color: #c0392b !important; color: #fff !important; }
    .flatpickr-calendar { font-family: "Sarabun", sans-serif !important; border-radius: 12px !important; box-shadow: 0 8px 30px rgba(0,0,0,0.2) !important; }
  </style>
  <style>
    :root {
      --brand:     #1a3a5c;
      --gold:      #b8860b;
      --danger:    #c0392b;
      --danger-bg: #fff0ef;
      --safe:      #16a34a;
      --safe-bg:   #f0fdf4;
      --surface:   #f4f6f9;
      --card-bg:   #ffffff;
      --text:      #1e293b;
      --muted:     #64748b;
      --border:    #e2e8f0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: "Sarabun", sans-serif;
      background: var(--surface);
      color: var(--text);
      min-height: 100dvh;
    }

    /* ===== HEADER ===== */
    .dash-header {
      background: var(--brand);
      color: #fff;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .header-right { display: flex; align-items: center; gap: 10px; }

    .summary-chip {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 600;
    }

    #total-count { font-size: 18px; font-weight: 700; }

    .lock-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .lock-btn.unlocked { background: var(--gold); border-color: var(--gold); }

    .search-row {
      margin-top: 10px;
    }

    .search-input {
      width: 100%;
      padding: 8px 14px;
      font-family: "Sarabun", sans-serif;
      font-size: 15px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      outline: none;
    }

    .search-input::placeholder { color: rgba(255,255,255,0.45); }
    .search-input:focus { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.15); }

    .search-btn { font-size: 18px; }
    .search-btn.active { background: rgba(255,255,255,0.25) !important; border-color: rgba(255,255,255,0.4) !important; }

    /* Mode tabs */
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 12px; }

    .mode-tab {
      flex: 1;
      padding: 8px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.6);
      font-family: "Sarabun", sans-serif;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .mode-tab.active { background: var(--gold); border-color: var(--gold); color: #fff; }

    /* Day nav */
    .day-nav { display: flex; align-items: center; gap: 8px; }

    .nav-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .nav-btn:active { background: rgba(255,255,255,0.25); }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    #date-picker {
      flex: 1;
      padding: 8px 12px;
      font-family: "Sarabun", sans-serif;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      cursor: pointer;
      text-align: center;
      outline: none;
      color-scheme: dark;
    }

    .today-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      padding: 0 14px;
      height: 36px;
      border-radius: 8px;
      font-family: "Sarabun", sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Month nav */
    .month-nav { display: flex; align-items: center; gap: 8px; }

    .month-label {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* Month sub-tabs */
    .month-subtabs { display: flex; gap: 6px; margin-top: 10px; }

    .month-subtab {
      flex: 1;
      padding: 6px 8px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.55);
      font-family: "Sarabun", sans-serif;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .month-subtab.active { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); color: #fff; }

    /* Queue calendar */
    .queue-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .queue-header { text-align: center; font-size: 11px; color: #64748b; padding: 4px 0; font-weight: 600; }
    .queue-cell { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px 2px; text-align: center; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .queue-empty { background: transparent !important; border: none !important; }
    .queue-past  { opacity: 0.4; }
    .queue-today { background: #eff6ff !important; border-color: #3b82f6 !important; }
    .queue-date  { font-size: 12px; color: #475569; font-weight: 600; }
    .queue-count-green  { font-size: 16px; font-weight: 700; color: #16a34a; }
    .queue-count-orange { font-size: 16px; font-weight: 700; color: #d97706; }
    .queue-count-red    { font-size: 16px; font-weight: 700; color: #dc2626; }
    .queue-count-zero   { font-size: 13px; color: #cbd5e1; }
    .queue-count-closed { font-size: 10px; color: #94a3b8; }

    /* ===== CONTENT ===== */
    .content { padding: 16px 16px 150px; max-width: 600px; margin: 0 auto; }

    .closed-banner {
      background: #1e293b;
      color: #f8fafc;
      text-align: center;
      padding: 18px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: none;
    }

    .section-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
      cursor: pointer;
      display: inline-block;
      text-decoration: underline dotted;
    }

    .export-day-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      padding: 8px 12px;
      background: var(--safe-bg);
      color: var(--safe);
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }
    .export-day-btn:active { background: #dcfce7; }

    /* Month date group */
    .date-group { margin-bottom: 24px; }

    .date-group-header {
      font-size: 14px;
      font-weight: 700;
      color: var(--brand);
      background: #e8eef5;
      padding: 8px 14px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .date-group-count {
      font-size: 12px;
      font-weight: 600;
      background: var(--brand);
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* ===== CARDS ===== */
    .booking-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 16px 18px;
      margin-bottom: 10px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .booking-card.allergy { border-color: var(--danger); background: var(--danger-bg); }

    .time-col {
      background: var(--brand);
      color: #fff;
      border-radius: 8px;
      padding: 10px 12px;
      text-align: center;
      min-width: 60px;
      flex-shrink: 0;
    }

    .booking-card.allergy .time-col { background: var(--danger); }

    .time-col .time-text { font-size: 18px; font-weight: 700; line-height: 1; display: block; }
    .time-col .count-text { font-size: 11px; opacity: 0.85; margin-top: 4px; display: block; }

    .info-col { flex: 1; min-width: 0; }

    .guest-name {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .guest-phone { font-size: 14px; color: var(--muted); margin-bottom: 8px; }

    .card-date {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: var(--brand);
      background: #e8eef5;
      padding: 3px 9px;
      border-radius: 5px;
      margin-bottom: 7px;
      letter-spacing: 0.2px;
    }

    .allergy-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .allergy-tag.has-allergy  { background: var(--danger); color: #fff; }
    .allergy-tag.no-allergy   { background: var(--safe-bg); color: var(--safe); border: 1px solid #bbf7d0; }
    .allergy-tag.not-informed { background: #fef9c3; color: #854d0e; border: 1px solid #fde047; }

    .notes-text {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #92400e;
      background: #fffbeb;
      border: 1px solid #fde68a;
      padding: 4px 10px;
      border-radius: 6px;
      line-height: 1.4;
    }

    /* Edit buttons */
    .card-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }

    /* ===== COMPACT 2-COLUMN ===== */
    #booking-list.compact {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    #booking-list.compact .booking-card {
      padding: 10px;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 0;
    }

    #booking-list.compact .time-col {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      min-width: unset;
      border-radius: 6px;
    }

    #booking-list.compact .time-col .time-text  { font-size: 15px; }
    #booking-list.compact .time-col .count-text { font-size: 11px; margin-top: 0; }
    #booking-list.compact .guest-name  { font-size: 13px; }
    #booking-list.compact .guest-phone { font-size: 12px; margin-bottom: 6px; }
    #booking-list.compact .notes-text  { font-size: 11px; padding: 3px 7px; margin-top: 4px; }
    #booking-list.compact .card-actions { display: none; }
    #booking-list.compact .allergy-tag { font-size: 11px; padding: 3px 7px; }

    .compact-btn { font-size: 18px; opacity: 0.7; }
    .compact-btn.active { opacity: 1; background: rgba(255,255,255,0.25) !important; }

    .btn-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-edit            { background: #dbeafe; color: #1d4ed8; }
    .btn-cancel-booking  { background: #fee2e2; color: #b91c1c; }
    .btn-copy            { background: #f3f4f6; color: #374151; }
    .btn-restore         { background: #dbeafe; color: #1d4ed8; width: auto; padding: 0 10px; gap: 4px; }
    .btn-delete          { background: #fee2e2; color: #b91c1c; }

    .cancelled-tag {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: #fee2e2;
      color: #b91c1c;
      margin-top: 4px;
    }

    .channel-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 6px;
      background: #ede9fe;
      color: #6d28d9;
      border: 1px solid #ddd6fe;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* Cancel-reason filter chips */
    .reason-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .reason-chip {
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      cursor: pointer;
    }
    .reason-chip.active { background: var(--danger); border-color: var(--danger); color: #fff; }

    /* ===== FABs ===== */
    .add-fab {
      position: fixed;
      bottom: 80px;
      right: 20px;
      background: var(--gold);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 14px 20px;
      font-family: "Sarabun", sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      align-items: center;
      gap: 6px;
      z-index: 200;
      display: none;
    }

    .add-fab.visible { display: flex; }

    .refresh-fab {
      position: fixed;
      bottom: 24px;
      right: 20px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 14px 20px;
      font-family: "Sarabun", sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s;
      z-index: 200;
    }

    .refresh-fab:active { transform: scale(0.95); }
    .refresh-fab.spinning .spin-icon { animation: spin 0.8s linear infinite; }

    /* ===== STATES ===== */
    .state-box { text-align: center; padding: 60px 20px; color: var(--muted); }
    .state-box .icon { font-size: 40px; margin-bottom: 12px; }
    .state-box h3 { font-size: 17px; margin-bottom: 4px; }
    .state-box p  { font-size: 14px; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== MODALS ===== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      max-height: 90dvh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--brand);
      margin-bottom: 20px;
    }

    .field-group { margin-bottom: 14px; }

    .field-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      display: block;
    }

    .field-input, .field-select, .field-textarea {
      width: 100%;
      padding: 10px 12px;
      font-family: "Sarabun", sans-serif;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      color: var(--text);
      background: #fff;
    }

    .field-input:focus, .field-select:focus, .field-textarea:focus { border-color: var(--brand); }
    .field-textarea { resize: vertical; min-height: 70px; }

    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }

    .btn-cancel {
      flex: 1;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: "Sarabun", sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
    }

    .btn-confirm {
      flex: 1;
      padding: 12px;
      background: var(--brand);
      border: none;
      border-radius: 8px;
      font-family: "Sarabun", sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
    }

    .btn-confirm:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-danger {
      flex: 1;
      padding: 12px;
      background: var(--danger);
      border: none;
      border-radius: 8px;
      font-family: "Sarabun", sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
    }

    .user-tag {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      background: var(--gold);
      padding: 4px 10px;
      border-radius: 12px;
      letter-spacing: 0.3px;
    }

    .audit-info {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
    }

    .audit-info span {
      display: inline-block;
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      margin-right: 4px;
    }

    .pwd-error { color: var(--danger); font-size: 13px; font-weight: 600; margin-top: 8px; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60%  { transform: translateX(-6px); }
      40%,80%  { transform: translateX(6px); }
    }

    .shake { animation: shake 0.4s ease; }

    /* ===== AUTOCOMPLETE ===== */
    .autocomplete-wrap { position: relative; }

    .autocomplete-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      z-index: 999;
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }

    .autocomplete-dropdown.open { display: block; }

    .ac-item {
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }

    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover, .ac-item.focused { background: #f0f6ff; }

    .ac-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .ac-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 8px;
    }

    .ac-visits {
      background: var(--brand);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 10px;
    }

    .ac-returning {
      font-size: 11px;
      color: var(--gold);
      font-weight: 700;
    }
  </style>
</head>
<body>

<div id="dashboard">

  <div class="dash-header">
    <div class="header-top">
      <span class="brand-name">Siplor</span>
      <div class="header-right">
        <div class="summary-chip"><span id="total-count">—</span> คน</div>
        <span id="user-tag" class="user-tag" style="display:none"></span>
        <button class="lock-btn search-btn" id="search-btn" onclick="toggleSearch()">🔍</button>
        <button class="lock-btn" id="lock-btn" onclick="openPwdModal()">🔒</button>
      </div>
    </div>

    <div class="search-row" id="search-row" style="display:none">
      <input type="text" id="search-input" class="search-input"
             placeholder="ค้นหาชื่อ เบอร์โทร หมายเหตุ..."
             oninput="onSearch(this.value)">
    </div>

    <div class="mode-tabs">
      <div class="mode-tab active" id="tab-day"   onclick="setMode('day')">📅 รายวัน</div>
      <div class="mode-tab"        id="tab-month" onclick="setMode('month')">📆 รายเดือน</div>
    </div>

    <div class="day-nav" id="day-nav">

         onclick="if(mode==='day' && fp) fp.open()"></div>

    <div id="booking-list"></div>

    <span class="spin-icon">&#8635;</span> รีเฟรช
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
  const API_URL  = "https://siplor.fxrkssr.workers.dev";
  // รหัสผ่านย้ายไปเก็บเป็น secret ฝั่ง Cloudflare Worker (USERS_JSON) — ไม่อยู่ใน source อีกต่อไป
  const MAX_MONTHS_AHEAD = 3;
  const TIMES = [
    "17:00","17:30","18:00","18:30","19:00","19:30",
    "20:00","20:30","21:00","21:30","22:00"
  ];
  const CHANNELS       = ["Meta", "Call", "Line"];
  const CANCEL_REASONS = ["จองซ้ำ", "ยกเลิกในวัน", "ยกเลิกล่วงหน้า", "no show"];

  let mode               = "day";
  let currentMonth       = "";
  let monthTab           = "upcoming";
  let compact            = false;
  let searchQuery        = "";
  let _allBookings       = [];
  let _allSearchBookings = [];
  let fp                 = null;
  let authed             = false;
  let currentUser        = "";
  let authToken          = "";   // รหัสที่พิมพ์ตอน login — แนบไปทุก POST เขียน
  let editingRow             = null;
  let isRestoring            = false;
  let cancelTarget           = null;
  let _allCancelledBookings  = [];
  let cancelReasonFilter     = "";   // "" = ทุกเหตุผล
  let _bookingsByRow     = {};
  let _customerList      = [];   // ← NEW: customer cache
  let _acFocusIdx        = -1;   // ← NEW: keyboard nav index

  // ===== INIT =====
  function initDashboard() {
    const sel = document.getElementById("f-time");
    TIMES.forEach(t => {
      const o = document.createElement("option");
      o.value = o.textContent = t;
      sel.appendChild(o);
    });

    fp = flatpickr("#date-picker", {
      dateFormat: "Y-m-d",
      disableMobile: true,
      onDayCreate(dObj, dStr, fpInst, dayElem) {
        if (dayElem.dateObj.getDay() === 2) dayElem.classList.add("tuesday");
      },
      onChange() { loadBookings(); }
    });
    goToday();
    loadCustomers(); // ← NEW
  }

  // ===== HELPERS =====
  function todayISO() {
    return new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Bangkok" });
  }

  function thisMonthISO() { return todayISO().substring(0, 7); }

  function nowTimeBKK() {
    return new Date().toLocaleTimeString("sv-SE", { timeZone: "Asia/Bangkok" }).substring(0, 5);
  }

  function isPast(b) {
    return b.date < todayISO();
  }

  function formatDateTH(iso) {
    const [y, m, d] = iso.split("-");
    const months = ["","ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.",
                    "ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
    const days   = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัส","ศุกร์","เสาร์"];
    const dow    = new Date(iso + "T00:00:00").getDay();
    return `${days[dow]} ${parseInt(d)} ${months[parseInt(m)]} ${parseInt(y) + 543}`;
  }

  function formatMonthTH(ym) {
    const [y, m] = ym.split("-");
    const months = ["","มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน",
                    "กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
    return `${months[parseInt(m)]} ${parseInt(y) + 543}`;
  }

  function addMonths(ym, delta) {
    const [y, m] = ym.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    return d.toLocaleDateString("sv-SE", { year: "numeric", month: "2-digit" }).substring(0, 7);
  }

  // ===== AUTH =====
  function openPwdModal() {
    if (authed) { logout(); return; }
    document.getElementById("pwd-input").value = "";
    document.getElementById("pwd-error").style.display = "none";
    document.getElementById("pwd-overlay").style.display = "flex";
    setTimeout(() => document.getElementById("pwd-input").focus(), 100);
  }

  function closePwdModal() {
    document.getElementById("pwd-overlay").style.display = "none";
  }

  async function submitPassword() {
    const val = document.getElementById("pwd-input").value;
    const fail = () => {
      const input = document.getElementById("pwd-input");
      document.getElementById("pwd-error").style.display = "block";
      input.classList.add("shake");
      input.value = "";
      setTimeout(() => input.classList.remove("shake"), 400);
    };

    let res;
    try {
      res = await apiPost({ action: "auth", token: val });
    } catch (e) {
      alert("เชื่อมต่อไม่ได้");
      return;
    }

    if (res && res.ok && res.user) {
      authed      = true;
      currentUser = res.user;
      authToken   = val;
      closePwdModal();
      document.getElementById("lock-btn").textContent = "🔓";
      document.getElementById("lock-btn").classList.add("unlocked");
      document.getElementById("add-fab").classList.add("visible");
      const tag = document.getElementById("user-tag");
      tag.textContent = res.user;
      tag.style.display = "inline";
      loadBookings();
    } else {
      fail();
    }
  }

  function logout() {
    authed      = false;
    currentUser = "";
    authToken   = "";
    document.getElementById("lock-btn").textContent = "🔒";
    document.getElementById("lock-btn").classList.remove("unlocked");
    document.getElementById("add-fab").classList.remove("visible");
    document.getElementById("user-tag").style.display = "none";
    loadBookings();
  }

  // ===== MODE =====
  function setMode(m) {
    mode = m;
    document.getElementById("tab-day").classList.toggle("active",   m === "day");
    document.getElementById("tab-month").classList.toggle("active", m === "month");
    document.getElementById("day-nav").style.display   = m === "day"   ? "flex" : "none";
    document.getElementById("month-nav").style.display = m === "month" ? "flex" : "none";

    if (m === "month") {
      currentMonth = thisMonthISO();
      updateMonthNav();
      monthTab = "upcoming";
      document.getElementById("month-subtabs").style.display = "flex";
      ["upcoming","visited","all","cancelled","queue"].forEach(t =>
        document.getElementById(`subtab-${t}`).classList.toggle("active", t === "upcoming")
      );
    } else {
      document.getElementById("month-subtabs").style.display = "none";
    }
    loadBookings();
  }

  function setMonthTab(tab) {
    monthTab = tab;
    cancelReasonFilter = "";
    ["upcoming","visited","all","cancelled","queue"].forEach(t =>
      document.getElementById(`subtab-${t}`).classList.toggle("active", t === tab)
    );
    if (tab === "cancelled") {
      loadCancelledBookings();
    } else {
      renderFromCache();
    }
  }

  async function toggleSearch() {
    const row = document.getElementById("search-row");
    const btn = document.getElementById("search-btn");
    const open = row.style.display === "none";
    row.style.display = open ? "block" : "none";
    btn.classList.toggle("active", open);
    if (open) {
      await loadMonthForSearch();
      document.getElementById("search-input").focus();
    } else {
      onSearch("");
      _allSearchBookings = [];
      document.getElementById("search-input").value = "";
      loadBookings();
    }
  }

  async function loadMonthForSearch() {
    try {
      const list = document.getElementById("booking-list");
      list.innerHTML = renderLoading();
      const res = await fetch(`${API_URL}?all=1&_=${Date.now()}`);
      if (!res.ok) return;
      const bookings = await res.json();
      bookings.forEach(b => _bookingsByRow[b._row] = b);
      _allSearchBookings = bookings;
      renderFromCache();
    } catch(e) {}
  }

  function onSearch(val) {
    searchQuery = val.trim().toLowerCase();
    renderFromCache();
  }

  function filterBookings(bookings) {
    if (!searchQuery) return bookings;
    const qPhone = searchQuery.replace(/[-\s]/g, "");
    return bookings.filter(b => {
      const phone = b.phone.replace(/[-\s]/g, "");
      return b.name.toLowerCase().includes(searchQuery) ||
             phone.includes(qPhone) ||
             (b.notes && b.notes.toLowerCase().includes(searchQuery));
    });
  }

  function renderFromCache() {
    const list  = document.getElementById("booking-list");
    const label = document.getElementById("section-label");
    document.getElementById("export-btn").style.display = "none";

    // Queue tab — calendar grid แสดงจำนวนคนต่อวัน
    if (!searchQuery && mode === "month" && monthTab === "queue") {
      label.textContent = formatMonthTH(currentMonth);
      document.getElementById("total-count").textContent = "—";
      list.innerHTML = renderQueueCalendar();
      return;
    }

    // Cancelled tab — data มาจาก _allCancelledBookings แยก + filter ตามเหตุผล
    if (!searchQuery && mode === "month" && monthTab === "cancelled") {
      const byReason = cancelReasonFilter
        ? _allCancelledBookings.filter(b => (b.cancelReason || "") === cancelReasonFilter)
        : _allCancelledBookings;
      const total = byReason.reduce((s, b) => s + (parseInt(b.count) || 0), 0);
      document.getElementById("total-count").textContent = total;
      label.textContent = formatMonthTH(currentMonth);
      list.innerHTML = renderReasonFilter() + (byReason.length === 0
        ? renderEmptyCancelled()
        : renderMonthGroups(byReason));
      return;
    }

    const sourceData = searchQuery ? _allSearchBookings : _allBookings;
    let filtered = filterBookings(sourceData).filter(b => !b.cancelled);

    if (!searchQuery && mode === "month") {
      filtered = monthTab === "upcoming" ? filtered.filter(b => !isPast(b))
               : monthTab === "visited"  ? filtered.filter(b => isPast(b))
               : filtered;
    }

    const total = filtered.reduce((s, b) => s + (parseInt(b.count) || 0), 0);
    document.getElementById("total-count").textContent = total;

    if (searchQuery) {
      label.textContent = `ผลค้นหา — ${total} คน`;
      list.innerHTML = filtered.length === 0
        ? renderNoResult()
        : filtered.map(b => renderCard(b, true)).join("");
    } else if (mode === "day") {
      const date = document.getElementById("date-picker").value;
      label.textContent = total > 0 ? `${formatDateTH(date)} — ${total} คน` : formatDateTH(date);
      list.innerHTML = filtered.length === 0 ? renderEmptyDay(date) : filtered.map(b => renderCard(b)).join("");
      document.getElementById("export-btn").style.display = filtered.length > 0 ? "inline-flex" : "none";
    } else {
      label.textContent = formatMonthTH(currentMonth);
      list.innerHTML = filtered.length === 0
        ? renderEmptyMonth()
        : renderMonthGroups(filtered);
    }
  }

  function toggleCompact() {
    compact = !compact;
    const list = document.getElementById("booking-list");
    const btn  = document.getElementById("compact-btn");
    list.classList.toggle("compact", compact);
    btn.classList.toggle("active", compact);
    btn.textContent = compact ? "▤" : "⊞";
  }

  function goToday() { fp.setDate(todayISO(), true); }

  function shiftDate(delta) {
    const current = document.getElementById("date-picker").value || todayISO();
    const d = new Date(current + "T00:00:00");
    d.setDate(d.getDate() + delta);
    fp.setDate(d.toLocaleDateString("sv-SE"), true);
  }

  function shiftMonth(delta) {
    const next = addMonths(currentMonth, delta);
    const base = thisMonthISO();
    if (next < base || addMonths(next, 0) > addMonths(base, MAX_MONTHS_AHEAD)) return;
    currentMonth = next;
    updateMonthNav();
    loadBookings();
  }

  function updateMonthNav() {
    const base = thisMonthISO();
    document.getElementById("month-label").textContent = formatMonthTH(currentMonth);
    document.getElementById("month-prev").disabled = currentMonth <= base;
    document.getElementById("month-next").disabled = currentMonth >= addMonths(base, MAX_MONTHS_AHEAD);
  }

  // ===== LOAD =====
  async function loadCancelledBookings(showSpin = false) {
    const list       = document.getElementById("booking-list");
    const label      = document.getElementById("section-label");
    const refreshBtn = document.getElementById("refresh-btn");
    if (showSpin) refreshBtn.classList.add("spinning");
    else list.innerHTML = renderLoading();
    label.textContent = formatMonthTH(currentMonth);
    try {
      const res = await fetch(`${API_URL}?cancelled=1&month=${currentMonth}&_=${Date.now()}`);
      if (!res.ok) throw new Error();
      _allCancelledBookings = await res.json();
      renderFromCache();
    } catch (e) {
      list.innerHTML = renderError();
    } finally {
      refreshBtn.classList.remove("spinning");
    }
  }

  async function loadBookings(showSpin = false) {
    if (mode === "month" && monthTab === "cancelled") {
      await loadCancelledBookings(showSpin);
      return;
    }

    const list       = document.getElementById("booking-list");
    const label      = document.getElementById("section-label");
    const refreshBtn = document.getElementById("refresh-btn");

    document.getElementById("total-count").textContent = "—";
    _bookingsByRow = {};

    const banner = document.getElementById("closed-banner");
    if (mode === "day") {
      const selDate   = new Date(document.getElementById("date-picker").value + "T00:00:00");
      const isTuesday = selDate.getDay() === 2;
      banner.style.display = isTuesday ? "block" : "none";
      if (isTuesday) {
        document.getElementById("total-count").textContent = "0";
        list.innerHTML = "";
        refreshBtn.classList.remove("spinning");
        label.textContent = formatDateTH(document.getElementById("date-picker").value);
        return;
      }
    } else {
      banner.style.display = "none";
    }

    if (showSpin) {
      refreshBtn.classList.add("spinning");
    } else {
      list.innerHTML = renderLoading();
    }

    try {
      let bookings;

      if (mode === "day") {
        const date = document.getElementById("date-picker").value;
        label.textContent = formatDateTH(date);
        const res = await fetch(`${API_URL}?date=${date}&_=${Date.now()}`);
        if (!res.ok) throw new Error();
        bookings = await res.json();
        bookings.forEach(b => _bookingsByRow[b._row] = b);
        _allBookings = bookings;
        label.textContent = formatDateTH(date);
        renderFromCache();
      } else {
        if (!currentMonth) currentMonth = thisMonthISO();
        label.textContent = formatMonthTH(currentMonth);
        const res = await fetch(`${API_URL}?month=${currentMonth}&_=${Date.now()}`);
        if (!res.ok) throw new Error();
        bookings = await res.json();
        bookings.forEach(b => _bookingsByRow[b._row] = b);
        _allBookings = bookings;
        renderFromCache();
      }
    } catch (e) {
      list.innerHTML = renderError();
    } finally {
      refreshBtn.classList.remove("spinning");
    }
  }

  // ===== RENDER =====
  function renderCard(b, showDate = false) {
    const cls = b.hasAllergy ? " allergy" : "";
    const allergyTag = b.hasAllergy
      ? `<span class="allergy-tag has-allergy">&#9888; แพ้ ${escHtml(b.allergy)}</span>`
      : (!b.allergy || b.allergy === "ไม่ได้แจ้ง"
          ? `<span class="allergy-tag not-informed">&#8212; ไม่ได้แจ้ง</span>`
          : `<span class="allergy-tag no-allergy">&#10003; ไม่แพ้อาหาร</span>`);

    if (b.editedBy)     auditParts.push(`แก้ไขโดย ${escHtml(b.editedBy)}${b.editedAt     ? " " + formatAuditTime(b.editedAt)     : ""}`);

    const auditLine = (authed && auditParts.length)
      ? `<div class="audit-info">${auditParts.map(p => `<span>${p}</span>`).join("")}</div>` : "";

      ? `<span class="cancelled-tag">❌ ยกเลิกแล้ว${b.cancelReason ? " · " + escHtml(b.cancelReason) : ""}</span>` : "";

    const channelBadge = b.channel

    const cust = _customerList.find(c => c.phone === b.phone);
    const visitBadge = (cust && cust.totalVisits >= 1)
      ? `<span style="
            display:inline-block;
            font-size:11px;

      : "";

    return `
      <div class="booking-card${cls}">
        <div class="time-col">
          <span class="time-text">${escHtml(b.time)}</span>

  function formatAuditTime(dt) {
    if (!dt) return "";
    const m1 = dt.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})/);
    if (m1) return `${parseInt(m1[3])}/${parseInt(m1[2])} ${m1[4]} น.`;
    const d = new Date(dt);
    if (!isNaN(d)) {
      const iso = d.toLocaleDateString("sv-SE", { timeZone: "Asia/Bangkok" });
      const t   = d.toLocaleTimeString("sv-SE", { timeZone: "Asia/Bangkok" }).substring(0, 5);
      const [, mm, dd] = iso.split("-");
      return `${parseInt(dd)}/${parseInt(mm)} ${t} น.`;
    }
    return dt;
  }

  function renderMonthGroups(bookings) {
    const groups = {};
    for (const b of bookings) {
      if (!groups[b.date]) groups[b.date] = [];
      groups[b.date].push(b);
    }
    return Object.keys(groups).sort().map(date => {
      const list  = groups[date];
      const total = list.reduce((s, b) => s + (parseInt(b.count) || 0), 0);
      return `
        <div class="date-group">
          <div class="date-group-header">
            <span>${formatDateTH(date)}</span>
            <span class="date-group-count">${total} คน</span>
          </div>
          ${list.map(b => renderCard(b)).join("")}
        </div>`;
    }).join("");
  }

  async function submitBookingForm() {
    const btn   = document.getElementById("form-submit-btn");
    const date    = document.getElementById("f-date").value;
    const name    = document.getElementById("f-name").value.trim();
    const phone   = document.getElementById("f-phone").value.trim();
    const channel = document.getElementById("f-channel").value;

    if (!date || !name || !phone) {
      alert("กรุณากรอกวันที่ ชื่อ และเบอร์โทรให้ครบ");
      return;
    }

    if (!channel) {
      alert("กรุณาเลือกช่องทางการจอง");
      return;
    }

    if (new Date(date + "T00:00:00").getDay() === 2) {
      alert("❌ วันอังคาร — ร้านปิด ไม่สามารถรับการจองได้");
      return;
    }

    btn.disabled = true;
    btn.textContent = "กำลังบันทึก...";

    const nowBKK = new Date().toLocaleString("sv-SE", { timeZone: "Asia/Bangkok" })
                              .replace("T", " ").substring(0, 16);

    try {
      const payload = {
        action:  editingRow ? "edit" : "add",
        _row:    editingRow,
        date,
        time:    document.getElementById("f-time").value,
        name,
        phone,
        count:   document.getElementById("f-count").value,
        channel,
        allergy: document.getElementById("f-allergy").value,
        notes:   document.getElementById("f-notes").value.trim(),
      };
      if (isRestoring) payload.restore = true;
      if (editingRow) {
        payload.editedBy = currentUser;
        payload.editedAt = nowBKK;
      } else {
        payload.addedBy = currentUser;
        payload.addedAt = nowBKK;
      }
      const res = await apiPost(payload);
      if (res.ok) {
        closeBookingForm();
        loadBookings(true);
      } else {
        alert("เกิดข้อผิดพลาด: " + (res.error || "ไม่ทราบสาเหตุ"));
      }
    } catch (e) {
      alert("ไม่สามารถเชื่อมต่อได้");
    } finally {
      btn.disabled = false;
      btn.textContent = "บันทึก";
    }
  }

  // ===== EXPORT CSV (สำหรับทีมเชฟ print) =====
  function exportDayCSV() {
    if (mode !== "day") { alert("เปลี่ยนไปโหมด รายวัน ก่อน export"); return; }
    const date = document.getElementById("date-picker").value;
    const rows = _allBookings
      .filter(b => !b.cancelled)
      .slice()
      .sort((a, b) => a.time.localeCompare(b.time));

    if (rows.length === 0) { alert("ไม่มีการจองในวันนี้"); return; }

    const csvCell = v => {
      const s = String(v ?? "");
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const header = ["เวลา", "ชื่อ", "เบอร์", "จำนวนคน", "แพ้อาหาร", "หมายเหตุ"];
    const lines  = [header.join(",")];
    rows.forEach(b => {
      lines.push([b.time, b.name, b.phone, b.count, b.allergy, b.notes].map(csvCell).join(","));
    });

    const csv  = "﻿" + lines.join("\r\n");   // BOM กัน Excel อ่านภาษาไทยเพี้ยน
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href = url;
    a.download = `siplor-${date}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ===== QUEUE CALENDAR =====
  function renderQueueCalendar() {
    const MAX = 15;
    const [year, month] = currentMonth.split('-').map(Number);
    const daysInMonth = new Date(year, month, 0).getDate();
    const firstDow    = new Date(year, month - 1, 1).getDay();
    const offset      = (firstDow + 6) % 7; // Monday-first
    const today       = todayISO();

    const countByDate = {};
    _allBookings.forEach(b => {
      countByDate[b.date] = (countByDate[b.date] || 0) + (parseInt(b.count) || 0);
    });

    const DAY_LABELS = ['จ','อ','พ','พฤ','ศ','ส','อา'];
    let html = `<div class="queue-grid">`;
    DAY_LABELS.forEach(d => { html += `<div class="queue-header">${d}</div>`; });

    for (let i = 0; i < offset; i++) html += `<div class="queue-cell queue-empty"></div>`;

    for (let day = 1; day <= daysInMonth; day++) {
      const mm      = String(month).padStart(2, '0');
      const dd      = String(day).padStart(2, '0');
      const dateStr = `${year}-${mm}-${dd}`;
      const dow     = new Date(dateStr + 'T00:00:00').getDay();
      const isTue   = dow === 2;
      const isPast  = dateStr < today;
      const isToday = dateStr === today;
      const count   = countByDate[dateStr] || 0;

      let cls, txt;
      if (isTue) {
        cls = 'queue-count-closed'; txt = 'ปิด';
      } else if (count === 0) {
        cls = 'queue-count-zero'; txt = '—';
      } else if (count >= MAX) {
        cls = 'queue-count-red'; txt = count;
      } else if (count >= 11) {
        cls = 'queue-count-orange'; txt = count;
      } else {
        cls = 'queue-count-green'; txt = count;
      }

      const extra = (isPast ? ' queue-past' : '') + (isToday ? ' queue-today' : '');
      const clickAttr = !isTue ? ` onclick="navigateToDay('${dateStr}')" style="cursor:pointer"` : '';
      html += `<div class="queue-cell${extra}"${clickAttr}>
        <div class="queue-date">${day}</div>
        <div class="${cls}">${txt}</div>
      </div>`;
    }

    html += `</div>`;
    return html;
  }

  // ===== COPY =====
  function copyBookingText(row, btn) {
    const b = _bookingsByRow[row]
           ?? _allSearchBookings.find(x => x._row === row)
           ?? _allCancelledBookings.find(x => x._row === row)
           ?? null;
    if (!b) return;

    const days   = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
    const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    const d = new Date(b.date + 'T00:00:00');
    const dayName = days[d.getDay()];
    const dateStr = `${d.getDate()} ${months[d.getMonth()]}`;
    const text = `การจองเรียบร้อยครับ คุณ${b.name} วัน${dayName}ที่ ${dateStr} ${b.time} ${b.count} ท่าน ${b.phone}`;

    const finish = () => { btn.textContent = '✅'; setTimeout(() => btn.textContent = '📋', 1500); };

    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(finish).catch(() => fallbackCopy(text, finish));
    } else {
      fallbackCopy(text, finish);
    }
  }

  function fallbackCopy(text, cb) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    cb();
  }

  function scheduleClosePhoneAC() { setTimeout(closePhoneAC, 150); }

  function highlight(text, q) {
    const idx = text.toLowerCase().indexOf(q);
    if (idx < 0) return text;
    return text.substring(0, idx)
      + `<mark style="background:#fef08a;border-radius:3px;padding:0 1px">${text.substring(idx, idx + q.length)}</mark>`
      + text.substring(idx + q.length);
  }

  function selectCustomer(idx) {
    const dd = document.getElementById("ac-dropdown");
    const matches = JSON.parse(dd.dataset.matches || '[]');
    if (matches[idx]) autofillCustomer(matches[idx]);
  }

  function autofillCustomer(c) {
    document.getElementById("f-name").value  = c.name;
    document.getElementById("f-phone").value = c.phone;
    if (c.allergy) document.getElementById("f-allergy").value = c.allergy;
    if (c.notes)   document.getElementById("f-notes").value   = c.notes;
    // returning badge
    const badge = document.getElementById("returning-badge");
    badge.style.display = c.totalVisits > 1 ? "inline" : "none";
    closeAC();
    closePhoneAC();
  }

  function setACFocus(idx) {
    _acFocusIdx = idx;
    document.querySelectorAll('.ac-item').forEach((el, i) => {
      el.classList.toggle('focused', i === idx);
    });
  }

  function onNameKeydown(e) {
    const dd = document.getElementById("ac-dropdown");
    if (!dd.classList.contains('open')) return;
    const items = dd.querySelectorAll('.ac-item');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      _acFocusIdx = Math.min(_acFocusIdx + 1, items.length - 1);
      setACFocus(_acFocusIdx);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      _acFocusIdx = Math.max(_acFocusIdx - 1, 0);
      setACFocus(_acFocusIdx);
    } else if (e.key === 'Enter' && _acFocusIdx >= 0) {
      e.preventDefault();
      selectCustomer(_acFocusIdx);
    } else if (e.key === 'Escape') {
      closeAC();
    }
  }

  function scheduleCloseAC() {
    setTimeout(closeAC, 150);
  }

  function closeAC() {
    const dd = document.getElementById("ac-dropdown");
    dd.classList.remove('open');
    dd.innerHTML = '';
    _acFocusIdx = -1;
  }

  initDashboard();
</script>
</body>
</html>
