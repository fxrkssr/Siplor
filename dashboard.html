<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Siplor — ระบบจองโต๊ะ</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand:      #1a3a5c;
      --gold:       #b8860b;
      --danger:     #c0392b;
      --danger-bg:  #fff0ef;
      --surface:    #f4f6f9;
      --card-bg:    #ffffff;
      --text:       #1e293b;
      --muted:      #64748b;
      --border:     #e2e8f0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: "Sarabun", sans-serif;
      background: var(--surface);
      color: var(--text);
      min-height: 100dvh;
    }

    /* ============ LOGIN ============ */
    #login-screen {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--brand);
    }

    .login-box {
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      width: 320px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .login-box h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--brand);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .login-box p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
      letter-spacing: 1px;
    }

    #pw-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 20px;
      font-family: "Sarabun", sans-serif;
      border: 2px solid var(--border);
      border-radius: 10px;
      text-align: center;
      letter-spacing: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    #pw-input:focus { border-color: var(--brand); }
    #pw-input.error-shake { border-color: var(--danger); animation: shake 0.3s ease; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%       { transform: translateX(-6px); }
      75%       { transform: translateX(6px); }
    }

    #login-btn {
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      background: var(--brand);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: "Sarabun", sans-serif;
      letter-spacing: 1px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #login-btn:active { background: #122c46; }

    #login-err {
      margin-top: 12px;
      font-size: 13px;
      color: var(--danger);
      min-height: 18px;
    }

    /* ============ DASHBOARD ============ */
    #dashboard { display: none; }

    .dash-header {
      background: var(--brand);
      color: #fff;
      padding: 20px 20px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .summary-chip {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 600;
    }

    #total-count { font-size: 18px; font-weight: 700; }

    .date-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .nav-btn:active { background: rgba(255,255,255,0.25); }

    #date-picker {
      flex: 1;
      padding: 8px 12px;
      font-family: "Sarabun", sans-serif;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      cursor: pointer;
      text-align: center;
      outline: none;
      color-scheme: dark;
    }

    .today-btn {
      background: var(--gold);
      border: none;
      color: #fff;
      padding: 0 14px;
      height: 36px;
      border-radius: 8px;
      font-family: "Sarabun", sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }

    .today-btn:active { opacity: 0.8; }

    .content { padding: 16px; max-width: 600px; margin: 0 auto; }

    .date-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
      cursor: pointer;
      display: inline-block;
      text-decoration: underline dotted;
    }

    .date-label:active { opacity: 0.6; }

    .booking-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 16px 18px;
      margin-bottom: 12px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .booking-card.allergy {
      border-color: var(--danger);
      background: var(--danger-bg);
    }

    .time-col {
      background: var(--brand);
      color: #fff;
      border-radius: 8px;
      padding: 10px 12px;
      text-align: center;
      min-width: 60px;
      flex-shrink: 0;
    }

    .booking-card.allergy .time-col { background: var(--danger); }

    .time-col .time-text {
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      display: block;
    }

    .time-col .count-text {
      font-size: 11px;
      opacity: 0.85;
      margin-top: 4px;
      display: block;
    }

    .info-col { flex: 1; min-width: 0; }

    .guest-name {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .guest-phone {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .allergy-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--danger);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .state-box {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .state-box .icon { font-size: 40px; margin-bottom: 12px; }
    .state-box h3 { font-size: 17px; margin-bottom: 4px; }
    .state-box p  { font-size: 14px; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .refresh-fab {
      position: fixed;
      bottom: 24px;
      right: 20px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 14px 20px;
      font-family: "Sarabun", sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s;
      z-index: 200;
    }

    .refresh-fab:active { transform: scale(0.95); }
    .refresh-fab .spin-icon { display: inline-block; }
    .refresh-fab.spinning .spin-icon { animation: spin 0.8s linear infinite; }
  </style>
</head>
<body>

<!-- =============== LOGIN =============== -->
<div id="login-screen">
  <div class="login-box">
    <h1>Siplor</h1>
    <p>ระบบจองโต๊ะสำหรับพนักงาน</p>
    <input type="password" id="pw-input" placeholder="••••" maxlength="20"
           onkeydown="if(event.key==='Enter') login()">
    <button id="login-btn" onclick="login()">เข้าสู่ระบบ</button>
    <p id="login-err"></p>
  </div>
</div>

<!-- =============== DASHBOARD =============== -->
<div id="dashboard">

  <div class="dash-header">
    <div class="header-top">
      <span class="brand-name">Siplor</span>
      <div class="summary-chip">
        <span id="total-count">—</span> คน
      </div>
    </div>
    <div class="date-nav">
      <button class="nav-btn" onclick="shiftDate(-1)">&#8249;</button>
      <input type="date" id="date-picker" onchange="loadBookings()">
      <button class="nav-btn" onclick="shiftDate(1)">&#8250;</button>
      <button class="today-btn" onclick="goToday()">วันนี้</button>
    </div>
  </div>

  <div class="content">
    <div class="date-label" id="date-label"
         onclick="document.getElementById('date-picker').showPicker()"></div>
    <div id="booking-list"></div>
  </div>

  <button class="refresh-fab" id="refresh-btn" onclick="loadBookings(true)">
    <span class="spin-icon">&#8635;</span> รีเฟรช
  </button>

</div>

<script>
  const API_URL  = "https://siplor.fxrkssr.workers.dev";
  const PASSWORD = "7777";

  function login() {
    const val   = document.getElementById("pw-input").value;
    const input = document.getElementById("pw-input");
    const err   = document.getElementById("login-err");

    if (val === PASSWORD) {
      sessionStorage.setItem("siplor_auth", "1");
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      initDashboard();
    } else {
      err.textContent = "รหัสผ่านไม่ถูกต้อง";
      input.value = "";
      input.classList.add("error-shake");
      setTimeout(() => input.classList.remove("error-shake"), 400);
    }
  }

  function initDashboard() { goToday(); }

  function todayISO() {
    return new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Bangkok" });
  }

  function goToday() {
    document.getElementById("date-picker").value = todayISO();
    loadBookings();
  }

  function shiftDate(delta) {
    const picker = document.getElementById("date-picker");
    const d = new Date(picker.value + "T00:00:00");
    d.setDate(d.getDate() + delta);
    picker.value = d.toLocaleDateString("sv-SE");
    loadBookings();
  }

  function formatDateTH(iso) {
    const [y, m, day] = iso.split("-");
    const months = ["","ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.",
                    "ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
    return `${parseInt(day)} ${months[parseInt(m)]} ${parseInt(y) + 543}`;
  }

  async function loadBookings(showSpin = false) {
    const date       = document.getElementById("date-picker").value;
    const list       = document.getElementById("booking-list");
    const label      = document.getElementById("date-label");
    const refreshBtn = document.getElementById("refresh-btn");

    label.textContent = formatDateTH(date);
    document.getElementById("total-count").textContent = "—";

    if (showSpin) {
      refreshBtn.classList.add("spinning");
    } else {
      list.innerHTML = renderLoading();
    }

    try {
      const res = await fetch(`${API_URL}?date=${date}&_=${Date.now()}`);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const bookings = await res.json();

      const total = bookings.reduce((s, b) => s + (parseInt(b.count) || 0), 0);
      document.getElementById("total-count").textContent = total;

      list.innerHTML = bookings.length === 0
        ? renderEmpty(date)
        : bookings.map(renderCard).join("");

    } catch (e) {
      list.innerHTML = renderError();
    } finally {
      refreshBtn.classList.remove("spinning");
    }
  }

  function renderCard(b) {
    const cls = b.hasAllergy ? " allergy" : "";
    const allergyTag = b.hasAllergy
      ? `<span class="allergy-tag">&#9888; แพ้ ${escHtml(b.allergy)}</span>`
      : "";

    return `
      <div class="booking-card${cls}">
        <div class="time-col">
          <span class="time-text">${escHtml(b.time)}</span>
          <span class="count-text">${escHtml(b.count)} คน</span>
        </div>
        <div class="info-col">
          <div class="guest-name">${escHtml(b.name)}</div>
          <div class="guest-phone">${escHtml(b.phone)}</div>
          ${allergyTag}
        </div>
      </div>`;
  }

  function renderLoading() {
    return `<div class="state-box"><div class="spinner"></div><p>กำลังโหลดข้อมูล...</p></div>`;
  }

  function renderEmpty(date) {
    const isToday = date === todayISO();
    return `<div class="state-box">
      <div class="icon">📋</div>
      <h3>ไม่มีการจองในวันนี้</h3>
      <p>${isToday ? "ยังไม่มีลูกค้าจองวันนี้" : "ไม่มีข้อมูลการจองในวันที่เลือก"}</p>
    </div>`;
  }

  function renderError() {
    return `<div class="state-box">
      <div class="icon">⚠️</div>
      <h3>โหลดข้อมูลไม่สำเร็จ</h3>
      <p>กรุณาตรวจสอบการเชื่อมต่อแล้วกด รีเฟรช</p>
    </div>`;
  }

  function escHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  if (sessionStorage.getItem("siplor_auth") === "1") {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    initDashboard();
  }
</script>
</body>
</html>
